# API Gateway - profil prod
# EUREKA_HOSTNAME : adresse du serveur Eureka a joindre. Defaut = 77.68.94.193
# (serveur actuel) ; surchargeable via l'environnement lors d'une bascule.

eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOSTNAME:77.68.94.193}:8761/eureka/
eureka.instance.hostname=gateway
eureka.instance.prefer-ip-address=true

# CORS_ALLOWED_ORIGINS : origine(s) HTTP(S) du frontend en prod, separees par
# des virgules (ex: https://mondomaine.com). A definir dans .env une fois le
# domaine/serveur de prod connu - la valeur par defaut ci-dessous est l'IP
# actuellement connue, a remplacer sans toucher au code.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://77.68.94.193}
