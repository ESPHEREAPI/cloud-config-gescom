# API Gateway - profil dev (local, une seule machine)

eureka.client.serviceUrl.defaultZone=http://127.0.0.1:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# CORS_ALLOWED_ORIGINS : surcharge possible via variable d'environnement pour
# tester depuis un autre appareil du reseau local (ex: http://192.168.1.4:4200).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
