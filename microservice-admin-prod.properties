# Microservice Admin - profil prod
# Les identifiants DB et le secret JWT ne sont JAMAIS definis ici : ils viennent
# uniquement des variables d'environnement SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
# et APP_JWTSECRET, fournies par docker-compose.yml (ou l'environnement du serveur).
# EUREKA_HOSTNAME (defaut 77.68.94.193) reste surchargeable via l'environnement.

eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOSTNAME:77.68.94.193}:8761/eureka/
eureka.instance.hostname=microservice-admin
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics

spring.h2.console.enabled=false
spring.jpa.show-sql=false
debug=false

logging.level.root=WARN
logging.level.sid.service_admin=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
