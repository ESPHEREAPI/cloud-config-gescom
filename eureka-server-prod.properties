# Eureka Server - profil prod
# EUREKA_HOSTNAME : adresse (IP publique, nom DNS ou nom de service Docker) a
# laquelle CE serveur Eureka doit etre joignable par les autres services.
# Defaut = 77.68.94.193 (serveur actuel) ; surchargeable via l'environnement
# du serveur/conteneur au moment de la bascule vers un nouveau serveur.

eureka.instance.hostname=${EUREKA_HOSTNAME:77.68.94.193}
eureka.instance.prefer-ip-address=false
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOSTNAME:77.68.94.193}:8761/eureka/
