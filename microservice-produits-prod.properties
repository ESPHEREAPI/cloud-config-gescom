# Microservice Produits - profil prod
# Les identifiants DB ne sont JAMAIS definis ici : ils viennent uniquement
# des variables d'environnement SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
# fournies par docker-compose.yml (ou l'environnement du serveur).
# EUREKA_HOSTNAME (defaut 77.68.94.193) reste surchargeable via l'environnement.

eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOSTNAME:77.68.94.193}:8761/eureka/
eureka.instance.hostname=microservice-produits
eureka.instance.prefer-ip-address=true

logging.level.root=WARN
logging.level.com.mproduits=INFO
logging.level.org.hibernate.SQL=WARN
