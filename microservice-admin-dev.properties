# Microservice Admin - profil dev (local, une seule machine)

eureka.client.serviceUrl.defaultZone=http://127.0.0.1:8761/eureka/
eureka.instance.hostname=microservice-admin
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics

# Confort local uniquement - jamais utilise en prod (voir *-prod.properties)
spring.datasource.url=jdbc:mysql://localhost:3306/easycom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=DeepWater@2021
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.jwtSecret=3cfa76ef890d4aed2d3981a7c93bd1a13c8796dafcb4f94fa578234a0df56b321
app.superadmin.username=admin
# Mot de passe fourni via la variable d'environnement APP_SUPERADMIN_PASSWORD au lancement (jamais en clair ici)

# APP_INTERNAL_SERVICE_SECRET (variable d'environnement) : meme valeur que
# cote microservice-produits, jamais dans un fichier versionne.
# APP_LICENCE_RSA_PRIVATE_KEY (variable d'environnement) : cle privee PEM
# PKCS8 pour signer les cles de licence (voir LicenceKeyService), generee
# avec `openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048` -
# jamais dans un fichier versionne.

spring.h2.console.enabled=true
spring.jpa.show-sql=true
debug=true

logging.file.name=myapp.log
logging.level.root=INFO
logging.level.sid.service_admin=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.apache.tomcat=DEBUG
logging.level.org.apache.catalina=DEBUG
