# Configuration Microservice Produits - commune dev/prod

mes-configs.limitDeProduits=6
spring.datasource.sql-script-encoding=UTF-8

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

spring.cloud.compatibility-verifier.enabled=false
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,metrics

# Tomcat
server.tomcat.connection-timeout=60000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=ProduitHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.fetch_size=200
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.jakarta.persistence.query.timeout=30000
spring.jpa.properties.hibernate.query.timeout=30
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Format des logs (le niveau et la destination varient par profil)
spring.main.banner-mode=console
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){magenta} %clr(%-5level){red} %clr(%logger{36}){cyan} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Metier
app.produit.tva=19.25

# Licence : duree de tolerance hors-ligne si microservice-administration est
# injoignable (voir LicenceStatusService) - pas un secret, valeur commune
# dev/prod. app.licence.adminBaseUrl (URL de l'admin) varie par profil, voir
# les fichiers -dev/-prod.
app.licence.graceMinutes=20
