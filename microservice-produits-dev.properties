# Microservice Produits - profil dev (local, une seule machine)

eureka.client.serviceUrl.defaultZone=http://127.0.0.1:8761/eureka/
eureka.instance.hostname=microservice-produits
eureka.instance.prefer-ip-address=true

# Confort local uniquement - jamais utilise en prod (voir *-prod.properties)
spring.datasource.url=jdbc:mysql://localhost:3306/easycom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
spring.datasource.username=root
spring.datasource.password=DeepWater@2021
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Confort local uniquement (voir *-prod.properties / docker-compose.yml)
app.licence.adminBaseUrl=http://localhost:9008
# APP_INTERNAL_SERVICE_SECRET (variable d'environnement) doit etre definie
# avant de lancer ce service ET microservice-administration, meme valeur des
# deux cotes - jamais dans un fichier versionne (voir aussi APP_JWTSECRET).

spring.output.ansi.enabled=ALWAYS
logging.file.name=myapp.log
logging.level.root=WARN
logging.level.com.mproduits=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.catalina=WARN
logging.level.com.fasterxml.jackson=WARN
